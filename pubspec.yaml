name: food_cart
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
  fonts:
    - family: Futura Std
      fonts:
        - asset: assets/fonts/FuturaStdRegular.otf
          weight: 400
        - asset: assets/fonts/FuturaStdHeavy.otf
          weight: 600
